# 📱 Marvarid Media Android ilovasini yig'ish.
# main tarmog'iga android/ ichida o'zgarish yuklansa (yoki Actions → Run workflow) — APK tayyorlanadi
# va GitHub → Releases → «android-latest» ga joylanadi.
#
# Imzo kaliti (ilova yangilanishlari bir xil imzo bilan chiqishi uchun) — Settings → Secrets and variables → Actions:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Ular bo'lmasa — sinov (debug) APK yig'iladi.
name: Android ilova

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ANDROID_HOME="$HOME/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null || true
          "$SDK" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "✅ Android SDK: $ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Imzo kaliti
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "✅ Imzo kaliti topildi — imzolangan APK yig'iladi"
          else
            echo "ℹ️ Imzo kaliti yo'q — sinov (debug) APK yig'iladi"
          fi

      - name: Yig'ish
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle --no-daemon --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../MarvaridMedia.apk
          else
            gradle --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../MarvaridMedia.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MarvaridMedia
          path: MarvaridMedia.apk

      - name: Releases'ga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=$([ "$SIGNED" = "1" ] && echo "imzolangan" || echo "sinov (debug)")
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest MarvaridMedia.apk \
            --title "📱 Marvarid Media 1.0.${{ github.run_number }}" \
            --notes "Android ilova — $kind versiya. APK faylni telefonga yuklab o'rnating." \
            --latest
