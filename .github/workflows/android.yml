# 📱 Marvarid Media Android ilovasini yig'ish.
# main tarmog'iga android/ ichida o'zgarish yuklansa (yoki Actions → Run workflow) — APK tayyorlanadi
# va GitHub → Releases → «android-latest» ga joylanadi.
#
# Imzo kaliti (Play Market va yangilanishlar uchun) — Settings → Secrets and variables → Actions:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Ular bo'lmasa — sinov (debug) APK yig'iladi.
name: Android ilova

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Imzo kaliti
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "✅ Imzo kaliti topildi — release APK va AAB yig'iladi"
          else
            echo "ℹ️ Imzo kaliti yo'q — sinov (debug) APK yig'iladi"
          fi

      - name: Yig'ish
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle --no-daemon --stacktrace assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk ../MarvaridMedia.apk
            cp app/build/outputs/bundle/release/app-release.aab ../MarvaridMedia.aab
          else
            gradle --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../MarvaridMedia.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MarvaridMedia
          path: |
            MarvaridMedia.apk
            MarvaridMedia.aab
          if-no-files-found: ignore

      - name: Releases'ga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="MarvaridMedia.apk"
          [ -f MarvaridMedia.aab ] && files="$files MarvaridMedia.aab"
          kind=$([ "$SIGNED" = "1" ] && echo "imzolangan" || echo "sinov (debug)")
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest $files \
            --title "📱 Marvarid Media 1.0.${{ github.run_number }}" \
            --notes "Android ilova — $kind versiya. APK faylni telefonga yuklab o'rnating. AAB — Play Market uchun." \
            --latest
