name: Uptime

# Har 10 daqiqada sayt va botni tekshiradi. Muammo bo'lsa — ishga tushish «Failed» bo'ladi va
# GitHub sizning emailingizga xabar yuboradi (Settings → Notifications → Actions yoqilgan bo'lsin).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sayt va bot tirikmi?
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://marvaridmedia-production.up.railway.app' }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 "$SITE_URL/healthz/deep"
