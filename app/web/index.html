<style>
  :root {
    --bg: #0b0a0d;
    --bg-soft: #121016;
    --surface: #18161c;
    --surface-2: #221f27;
    --line: rgba(255, 236, 196, .08);
    --text: #f6f2ea;
    --muted: #9b958c;
    --accent: #d9a943;
    --accent-2: #e9c46a;
    --on-grad: #1d1405;
    --glow: rgba(217, 169, 67, .38);
    --grad: linear-gradient(135deg, #f8e3a0 0%, #e2b450 45%, #b07c2a 100%);
    --gold: #f1cf7a;
    --green: #2fd17c;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    --nav-h: 64px;
    --r: 16px;
  }
  :root[data-theme="light"] {
    --bg: #f8f5ef;
    --bg-soft: #efe9de;
    --surface: #ffffff;
    --surface-2: #f1ebe0;
    --line: rgba(60, 40, 10, .1);
    --text: #1b1610;
    --muted: #7a6f60;
    --accent-2: #a8761f;
    --shadow: 0 10px 28px rgba(30, 36, 70, .14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 15px/1.4 "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); transition: background .25s; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
  .hidden { display: none !important; }

  /* ───── header ───── */
  .top { position: fixed; inset: 0 0 auto; z-index: 30; display: flex; align-items: center; gap: 7px;
    padding: 12px 16px; transition: background .25s, box-shadow .25s; }
  .top.solid { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px); box-shadow: 0 1px 0 var(--line); }
  .logo { display: flex; align-items: center; gap: 9px; margin-right: auto; min-width: 0; }
  .emblem { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 4px 12px rgba(214,170,80,.35)); }
  .emblem svg { width: 100%; height: 100%; display: block; }
  .word { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .word .w1 { font: 700 18px/1 "Cinzel", Georgia, serif; letter-spacing: 1.4px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 100%;
    background: linear-gradient(180deg, #fff1c2 0%, #f0cf7a 40%, #b98a33 75%, #e8c56f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
  .word .w2 { display: flex; align-items: center; gap: 5px; font: 600 9.5px/1 "Cinzel", Georgia, serif;
    letter-spacing: 3.4px; margin-top: 4px; color: #e2bf6c; }
  .word .w2::before, .word .w2::after { content: ""; width: 12px; height: 1px;
    background: linear-gradient(90deg, transparent, #d9b35e); }
  .word .w2::after { transform: scaleX(-1); }
  :root[data-theme="light"] .top.solid .word .w1 { background-image: linear-gradient(180deg, #c99a3c 0%, #8a6220 100%);
    filter: none; }
  :root[data-theme="light"] .top.solid .word .w2 { color: #9b7128; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: rgba(18, 16, 20, .55); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08); transition: transform .15s; }
  .top.solid .ibtn { background: var(--surface); color: var(--text); border-color: var(--line); }
  .ibtn:active { transform: scale(.92); }
  .ibtn svg { width: 20px; height: 20px; }
  .avatar { width: 40px; height: 40px; border-radius: 12px; flex: none; overflow: hidden; display: grid;
    place-items: center; background: var(--grad); color: var(--on-grad); font-weight: 800; font-size: 15px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* ───── hero ───── */
  .hero { position: relative; height: min(76vh, 600px); min-height: 440px; overflow: hidden; background: var(--bg-soft);
    touch-action: pan-y; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; pointer-events: none; }
  .slide.on { opacity: 1; pointer-events: auto; }
  .slide .bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%;
    transform: scale(1.08); transition: transform 6s ease-out; }
  .slide.on .bg { transform: scale(1); }
  .slide .bg.ph { background: radial-gradient(120% 80% at 70% 10%, #7a5a1e 0%, #241b0c 45%, var(--bg) 100%); }
  .slide .ph-icon { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); opacity: .35; }
  .slide .ph-icon svg { width: 120px; height: 120px; stroke-width: 1.2; color: #fff; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,10,13,.55) 0%, rgba(11,10,13,0) 20%, rgba(11,10,13,0) 34%,
      color-mix(in srgb, var(--bg) 78%, transparent) 56%, color-mix(in srgb, var(--bg) 94%, transparent) 72%, var(--bg) 100%); }
  .hero-body { position: absolute; left: 0; right: 0; bottom: 30px; padding: 0 16px; text-align: center; }
  .hero-title { font: 900 clamp(30px, 9.5vw, 44px)/1.02 "Montserrat", sans-serif; text-transform: uppercase;
    letter-spacing: -.5px; margin: 0 0 12px; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.55);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  :root[data-theme="light"] .hero-title { color: var(--text); text-shadow: 0 2px 16px rgba(255,255,255,.6); }
  .badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: var(--grad); color: var(--on-grad);
    letter-spacing: .4px; }
  .badge.gold { background: #121014; color: var(--gold); box-shadow: inset 0 0 0 1px #c9973a; }
  .badge.glass { background: rgba(255,255,255,.14); backdrop-filter: blur(8px); color: #fff; }
  :root[data-theme="light"] .badge.glass { background: var(--surface-2); color: var(--text); }
  .meta { font-weight: 700; font-size: 15px; color: var(--text); opacity: .95; }
  .meta i { font-style: normal; color: var(--muted); padding: 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding: 0 8px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn { height: 52px; border-radius: 15px; display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; font-weight: 800; font-size: 16px; transition: transform .15s, filter .15s; }
  .btn:active { transform: scale(.96); }
  .btn.primary { flex: 1.25; background: var(--grad); color: var(--on-grad); box-shadow: 0 10px 26px var(--glow); }
  .btn.primary svg { fill: currentColor; stroke: none; width: 18px; height: 18px; }
  .btn.soft { flex: 1; background: var(--surface-2); color: var(--text); }
  .btn.sq { width: 52px; flex: none; background: var(--surface-2); color: var(--text); }
  .btn.sq.on { color: var(--gold); }
  .btn.sq.on svg { fill: currentColor; }
  .btn.lock { background: linear-gradient(135deg, #f8d06b, #e9962b); color: #2a1f00; box-shadow: none; }
  .btn.lock svg { fill: none; stroke: currentColor; stroke-width: 2.2; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--muted); opacity: .35; transition: all .35s; }
  .dot.on { width: 26px; opacity: 1; background: var(--grad); }

  /* ───── rails ───── */
  .section { margin-top: 26px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; margin-bottom: 12px; }
  .sec-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.2px; }
  .sec-head h2 span { color: var(--muted); font-weight: 700; font-size: 14px; margin-left: 6px; }
  .more { display: flex; align-items: center; gap: 2px; color: var(--accent-2); font-weight: 700; font-size: 14px; }
  .more svg { width: 16px; height: 16px; }
  .rail { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory;
    scroll-padding-inline: 16px;
    scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail .card { width: 124px; flex: none; scroll-snap-align: start; }
  .rail.music .card { width: 140px; }

  .card { text-align: left; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .poster { position: relative; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--surface);
    box-shadow: var(--shadow); }
  .music .poster, .grid.music .poster { aspect-ratio: 1; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .3s; }
  .poster img.ok { opacity: 1; }
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 10px; text-align: center; color: #fff;
    background: linear-gradient(160deg, var(--c1, #8a6424), var(--c2, #17130d)); }
  .ph svg { width: 34px; height: 34px; opacity: .85; }
  .ph span { font-size: 12px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }
  .tag { position: absolute; top: 7px; font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 7px;
    color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); }
  .tag.l { left: 7px; } .tag.r { right: 7px; background: rgba(18,16,20,.85); color: var(--gold); box-shadow: inset 0 0 0 1px #c9973a; }
  .card .t { font-size: 13.5px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { font-size: 12px; color: var(--muted); margin-top: -3px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .card .m svg { width: 13px; height: 13px; }
  .card:active .poster { transform: scale(.97); }
  .poster { transition: transform .15s; }

  /* ───── pages ───── */
  .page { padding: 76px 16px 20px; }
  .page h1 { font-size: 26px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -.4px; }
  .page .lead { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .seg { display: inline-flex; background: var(--surface); border-radius: 13px; padding: 4px; gap: 4px; margin-bottom: 16px;
    border: 1px solid var(--line); }
  .seg button { padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--grad); color: var(--on-grad); }
  .gchips { display: flex; gap: 8px; overflow-x: auto; margin: -4px -16px 16px; padding: 2px 16px; scrollbar-width: none; }
  .gchips::-webkit-scrollbar { display: none; }
  .gchip { flex: none; padding: 8px 13px; border-radius: 999px; font-size: 13.5px; font-weight: 700; white-space: nowrap;
    background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  .gchip i { font-style: normal; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .gchip.on { background: var(--grad); color: var(--on-grad); border-color: transparent; }
  .gchip.on i { color: var(--on-grad); opacity: .7; }
  .fsel { display: flex; flex-wrap: wrap; gap: 8px; margin: -6px 0 18px; }
  .fpill { position: relative; display: inline-flex; align-items: center; height: 38px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; color: var(--text); }
  .fpill select { appearance: none; -webkit-appearance: none; border: 0; background: none; color: inherit; font: inherit;
    height: 100%; padding: 0 30px 0 12px; outline: 0; max-width: 46vw; text-overflow: ellipsis; }
  .fpill::after { content: ""; position: absolute; right: 12px; top: 15px; width: 6px; height: 6px; pointer-events: none;
    border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); opacity: .6; }
  .fpill.on { background: var(--grad); color: var(--on-grad); border-color: transparent; }
  .fpill select option { color: #111; background: #fff; }
  .fpill.reset { padding: 0 12px; color: var(--muted); }
  .fpill.reset::after { display: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
  @media (max-width: 340px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .grid.music { grid-template-columns: repeat(2, 1fr); }
  .searchbox { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 15px;
    background: var(--surface); border: 1px solid var(--line); margin: 8px 0 18px; }
  .searchbox svg { color: var(--muted); }
  .searchbox input { flex: 1; min-width: 0; width: 100%; border: 0; outline: 0; background: none; color: var(--text);
    font: 600 16px "Manrope", sans-serif; }
  .searchbox input::placeholder { color: var(--muted); }
  .group-title { font-weight: 800; font-size: 16px; margin: 20px 0 10px; }
  .empty { text-align: center; color: var(--muted); padding: 50px 20px; }
  .empty .big { width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center;
    background: var(--surface); color: var(--accent-2); }
  .empty .big svg { width: 34px; height: 34px; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
  .loadmore { display: block; margin: 22px auto 0; padding: 12px 22px; border-radius: 13px; background: var(--surface);
    color: var(--accent-2); font-weight: 700; }
  .rail.hist .card { width: 150px; }
  .rail.hist .poster { aspect-ratio: 16 / 10; }
  .rail.hist .poster img { object-position: center 25%; }
  .sk { background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size: 300% 100%; animation: sh 1.3s linear infinite; }
  @keyframes sh { to { background-position: -150% 0; } }

  /* ───── bottom nav ───── */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(7, 1fr);
    height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-top: 1px solid var(--line); }
  .nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: 10.5px; font-weight: 700; position: relative; white-space: nowrap; min-width: 0; }
  @media (max-width: 430px) { .nav button { font-size: 9.5px; letter-spacing: -.2px; } .nav button svg { width: 21px; height: 21px; } }
  @media (max-width: 350px) { .nav button { font-size: 8.5px; } }
  body.in-shorts .nav { background: rgba(0,0,0,.92); border-top-color: rgba(255,255,255,.08); }
  body.in-shorts .nav button { color: rgba(255,255,255,.55); }
  body.in-shorts .nav button.on { color: #fff; }
  .nav button svg { width: 23px; height: 23px; }
  .nav button.on { color: var(--text); }
  .nav button.on svg { color: var(--accent-2); }
  .nav button.on::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px;
    background: var(--grad); }

  /* ───── shorts ───── */
  body.in-shorts { overflow: hidden; }
  body.in-shorts .top { display: none; }
  .shorts { position: fixed; inset: 0 0 calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 20; background: #000;
    overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
  .shorts::-webkit-scrollbar { display: none; }
  .short { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; overflow: hidden;
    background: #000; color: #fff; }
  .short video, .short .pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .short .pic { background-size: cover; background-position: center; animation: kb 14s ease-in-out infinite alternate; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.12) translate(-2%, -2%); } }
  .short .fade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 18%, transparent 55%, rgba(0,0,0,.85) 100%); }
  .short .paused { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 74px; height: 74px;
    border-radius: 50%; background: rgba(0,0,0,.45); display: grid; place-items: center; opacity: 0; transition: opacity .2s;
    pointer-events: none; backdrop-filter: blur(6px); }
  .short .paused svg { width: 34px; height: 34px; fill: #fff; stroke: none; margin-left: 4px; }
  .short.is-paused .paused { opacity: 1; }
  .short .side { position: absolute; right: 12px; bottom: 120px; display: flex; flex-direction: column; gap: 18px;
    align-items: center; }
  .short .side button { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px;
    font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .short .side .rnd { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .short .side .rnd svg { width: 24px; height: 24px; }
  .short .side button.on .rnd { color: var(--gold); }
  .short .side button.on .rnd svg { fill: currentColor; }
  .short .bottom { position: absolute; left: 16px; right: 78px; bottom: 22px; }
  .short .bottom .badge { display: inline-block; margin-bottom: 8px; }
  .short .bottom h3 { margin: 0 0 4px; font: 900 22px/1.12 "Montserrat", sans-serif; text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,.6); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  .short .bottom .m { font-size: 13.5px; color: rgba(255,255,255,.8); font-weight: 600; margin-bottom: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .short .go { height: 46px; padding: 0 20px; border-radius: 14px; background: var(--grad); color: var(--on-grad); font-weight: 800;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 22px var(--glow); }

    x: '<path d="M18 6 6 18M6 6l12 12"/>',

    vol: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
    mute: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>',
    pause: '<rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/>',
    next: '<path d="M5 5.5v13a1 1 0 0 0 1.5.86L16 13.7V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.3L6.5 4.64A1 1 0 0 0 5 5.5z"/>',
    prev: '<path d="M19 5.5v13a1 1 0 0 1-1.5.86L8 13.7V18a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v4.3l9.5-5.66A1 1 0 0 1 19 5.5z"/>',
    tv: '<rect x="2.5" y="6" width="19" height="13.5" rx="2.5"/><path d="m8 2.5 4 3.5 4-3.5M8 22h8"/>',
    gem: '<path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M12 21 8 9l4-6 4 6z"/>'
  };
  var CAT_ICON = { movie: "film", serial: "tv", cartoon: "smile", music: "music" };
  function icon(name) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.innerHTML = P[name] || "";
    return s;
  }
  function h(tag, cls, kids) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    (kids == null ? [] : [].concat(kids)).forEach(function (k) {
      if (k == null || k === false) return;
      n.appendChild(typeof k === "string" || typeof k === "number" ? document.createTextNode(String(k)) : k);
    });
    return n;
  }
  var $ = function (id) { return document.getElementById(id); };

  function fmt(n) {
    n = +n || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "") + "M";
    if (n >= 1e4) return Math.floor(n / 1e3) + "K";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(".0", "") + "K";
    return String(n);
  }
  function haptic(kind) { try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
  function notify(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }
  var toastT;
  function toast(text) {
    var t = $("toast"); t.textContent = text; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 2600);
  }
  function api(path, opts) {
    opts = opts || {};
    if (PUB) path = path.replace(/^\/api\//, "/pub/");
    opts.headers = Object.assign({ "X-Init-Data": initData }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return { ok: false, reason: "error" }; });
    });
  }
  function hue(str) { var x = 0; for (var i = 0; i < str.length; i++) x = (x * 31 + str.charCodeAt(i)) % 360; return x; }
  function posterUrl(it) { return it.poster ? "/api/poster/" + it.id + "?v=" + it.poster : null; }

  // ───── mavzu (yorug' / qorong'i) ─────
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("bTheme").replaceChildren(icon(t === "dark" ? "sun" : "moon"));
    var c = t === "dark" ? "#0b0a0d" : "#f8f5ef";
    if (!PUB) { try { tg.setHeaderColor(c); tg.setBackgroundColor(c); tg.setBottomBarColor && tg.setBottomBarColor(c); } catch (e) {} }
    try { window.MarvaridApp && window.MarvaridApp.setTheme(t); } catch (e) {}
  }
  var theme = store.get("theme") || (!PUB && tg && tg.colorScheme === "light" ? "light" : "dark");
  applyTheme(theme);
  $("bTheme").onclick = function () { haptic(); theme = theme === "dark" ? "light" : "dark"; store.set("theme", theme); applyTheme(theme); };

  // ───── saqlanganlar (Telegram CloudStorage + zaxira localStorage) ─────
  var saved = {};
  try { saved = JSON.parse(store.get("saved") || "{}") || {}; } catch (e) { saved = {}; }
  var cloud = !PUB && tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
  function snap(it) {
    return { id: it.id, code: it.code, cat: it.cat, title: it.title, poster: it.poster, parts: it.parts,
             views: it.views, premium: it.premium, locked: it.locked, year: it.year, desc: (it.desc || "").slice(0, 300),
             genres: it.genres || [], country: it.country || "", lang: it.lang || "", quality: it.quality || "", t: Date.now() };
  }
  function gname(g) { return (g.label || "").replace(/^\S+\s/, ""); }
  function score(it) {
    var n = (it.likes || 0) + (it.dislikes || 0);
    return n >= 3 ? Math.round(it.likes * 100 / n) : null;
  }
  function shortMeta(it) {
    var bits = [];
    var sc = score(it);
    if (sc !== null) bits.push("👍 " + sc + "%");
    if (it.year) bits.push(it.year);
    if (it.genres && it.genres.length) bits.push(gname(it.genres[0]));
    if (!bits.length) bits.push(NAMES[it.cat] || "Kino");
    return bits.slice(0, 2).join(" · ");
  }
  // 🕘 ko'rilganlar: Telegram'da serverda (bot va saytdan), ilova/brauzerda shu qurilmada
  var localHist = [];
  try { localHist = JSON.parse(store.get("hist") || "[]") || []; } catch (e) { localHist = []; }
  function rememberWatch(it) {
    if (it.cat === "music") return;
    localHist = [snap(it)].concat(localHist.filter(function (x) { return x.id !== it.id; })).slice(0, 15);
    store.set("hist", JSON.stringify(localHist));
  }
  function persistSaved() { store.set("saved", JSON.stringify(saved)); }
  function toggleSaved(it) {
    var key = "b" + it.id;
    if (saved[key]) {
      delete saved[key];
      if (cloud) cloud.removeItem(key);
      toast("Saqlanganlardan olib tashlandi");
    } else {
      saved[key] = snap(it);
      if (cloud) cloud.setItem(key, JSON.stringify(saved[key]).slice(0, 4000));
      toast("🔖 Saqlanganlarga qo'shildi");
    }
    haptic("medium");
    persistSaved();
    return !!saved[key];
  }
  function isSaved(it) { return !!saved["b" + it.id]; }
  if (cloud) {
    cloud.getKeys(function (err, keys) {
      if (err || !keys) return;
      keys = keys.filter(function (k) { return /^b\d+$/.test(k); });
      if (!keys.length) return;
      cloud.getItems(keys, function (err2, vals) {
        if (err2 || !vals) return;
        Object.keys(vals).forEach(function (k) { try { if (vals[k]) saved[k] = JSON.parse(vals[k]); } catch (e) {} });
        persistSaved();
        if (current === "saved") show("saved");
      });
    });
  }

  // ───── kartochkalar ─────
  function posterNode(it) {
    var box = h("div", "poster");
    var ph = h("div", "ph", [icon(CAT_ICON[it.cat] || "film"), h("span", null, it.title)]);
    var x = hue(it.title || "");
    ph.style.setProperty("--c1", "hsl(" + (24 + x % 22) + "," + (42 + x % 20) + "%," + (30 + x % 12) + "%)");
    ph.style.setProperty("--c2", "hsl(" + (20 + x % 15) + ",25%,8%)");
    box.appendChild(ph);
    var url = posterUrl(it);
    if (url) {
      var img = new Image();
      img.alt = ""; img.loading = "lazy"; img.decoding = "async";
      img.onload = function () { img.classList.add("ok"); ph.remove(); };
      img.onerror = function () { img.remove(); };
      img.src = url;
      box.appendChild(img);
    }
    return box;
  }
  function card(it) {
    var b = h("button", "card");
    var p = posterNode(it);
    if (it.parts > 1) p.appendChild(h("span", "tag l", it.parts + " qism"));
    if (it.premium) p.appendChild(h("span", "tag r", "PREMIUM"));
    b.appendChild(p);
    b.appendChild(h("div", "t", it.title));
    b.appendChild(h("div", "m", shortMeta(it)));
    b._item = it;
    b.dataset.id = it.id;
    if (it.cat === "music") {
      p.appendChild(h("span", "eq", [h("i"), h("i"), h("i")]));
      if (Player.current && Player.current.id === it.id) b.classList.add("playing");
      b.onclick = function () { Player.playFrom(it, b); };
    } else {
      b.onclick = function () { openSheet(it); };
    }
    return b;
  }
  function skeletonCards(n, cls) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var c = h("div", "card", [h("div", "poster sk"), h("div", "t sk", " "), ]);
      c.style.pointerEvents = "none";
      out.push(c);
    }
    return out;
  }
  function emptyBox(ic, title, text) {
    var big = h("div", "big", [icon(ic)]);
    return h("div", "empty", [big, h("b", null, title), text]);
  }

  // ───── hero karusel ─────
  var heroTimer = null, heroIdx = 0, heroItems = [];
  function heroView(items) {
    heroItems = items;
    var wrap = h("section", "hero");
    if (!items.length) {
      var s = h("div", "slide on", [h("div", "bg ph"), h("div", "ph-icon", [icon("film")]), h("div", "shade")]);
      s.appendChild(h("div", "hero-body", [h("h1", "hero-title", "Tez orada"),
        h("div", "sub", "Yangi kinolar va multfilmlar shu yerda chiqadi")]));
      wrap.appendChild(s);
      return wrap;
    }
    var slides = items.map(function (it, i) {
      var bg = h("div", "bg" + (it.poster ? "" : " ph"));
      if (it.poster) bg.style.backgroundImage = "url('" + posterUrl(it) + "')";
      var s = h("div", "slide" + (i === 0 ? " on" : ""), [bg]);
      if (!it.poster) s.appendChild(h("div", "ph-icon", [icon(CAT_ICON[it.cat] || "film")]));
      s.appendChild(h("div", "shade"));
      var badges = h("div", "badges");
      badges.appendChild(h("span", "badge", i === 0 ? "YANGI" : "TAVSIYA"));
      if (it.premium) badges.appendChild(h("span", "badge gold", "PREMIUM"));
      if (it.parts > 1) badges.appendChild(h("span", "badge glass", it.parts + " qism"));
      var metaBits = [];
      if (it.year) metaBits.push(String(it.year));
      (it.genres || []).slice(0, 2).forEach(function (g) { metaBits.push(gname(g)); });
      if (metaBits.length < 3) metaBits.push(NAMES[it.cat] || "Kino");
      var meta = h("div", "meta");
      metaBits.forEach(function (b, k) { if (k) meta.appendChild(h("i", null, "·")); meta.appendChild(document.createTextNode(b)); });
      var body = h("div", "hero-body", [badges, h("h1", "hero-title", it.title), meta]);
      if (it.desc) body.appendChild(h("div", "sub", it.desc.split("\n")[0]));
      body.appendChild(actionRow(it, true));
      var dots = h("div", "dots");
      items.forEach(function (_, k) {
        var d = h("button", "dot" + (k === i ? " on" : ""));
        d.setAttribute("aria-label", String(k + 1));
        d.onclick = function (e) { e.stopPropagation(); goSlide(k); restartHero(); };
        dots.appendChild(d);
      });
      body.appendChild(dots);
      s.appendChild(body);
      return s;
    });
    slides.forEach(function (s) { wrap.appendChild(s); });
    // surish (swipe)
    var x0 = null, y0 = null;
    wrap.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; stopHero(); }, { passive: true });
    wrap.addEventListener("touchend", function (e) {
      if (x0 == null) return;

      x0 = null; restartHero();
    }, { passive: true });
    heroIdx = 0;
    restartHero();
    return wrap;
  }
  function goSlide(i) {
    var slides = document.querySelectorAll(".hero .slide");
    if (!slides.length) return;
    heroIdx = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle("on", k === heroIdx); });
  }
  function stopHero() { clearInterval(heroTimer); heroTimer = null; }
  function restartHero() {
    stopHero();
    if (heroItems.length > 1) heroTimer = setInterval(function () { goSlide(heroIdx + 1); }, 5500);
  }

  function actionRow(it, hero) {
    var row = h("div", "actions");
    var watchBtn = h("button", "btn primary" + (it.locked ? " lock" : ""),
      [icon(it.locked ? "lock" : "play"), it.locked ? "Premium" : (it.cat === "music" ? "Tinglash" : "Ko'rish")]);
    watchBtn.onclick = function (e) {
      e.stopPropagation();

    row.appendChild(watchBtn);
    if (it.cat === "music" && !it.locked) {
      var toBot = h("button", "btn sq", [icon("send")]);

  function openLink(url) {

  }
  function botLink(it) { return "https://t.me/" + me.bot + "?start=" + (it.code < 0 ? "m" + (-it.code) : it.code); }
  function share(it) {

    if (PUB && navigator.share) {
      navigator.share({ title: it.title, text: text, url: botLink(it) }).catch(function () {});
      return;

    openLink("https://t.me/share/url?url=" + encodeURIComponent(botLink(it)) + "&text=" + encodeURIComponent(text));

  // ───── sahifalar ─────
  var current = "home", reqId = 0;
  function rail(r) {
    var sec = h("section", "section");

    if (r.cat || r.more) {
      moreBtn = h("button", "more", ["Hammasi", icon("chev")]);
      moreBtn.onclick = r.more || function () { show(r.cat, { sort: r.sort }); };
    }
    sec.appendChild(h("div", "sec-head", [h("h2", null, r.title), moreBtn]));
    var list = h("div", "rail" + (r.cat === "music" ? " music" : "") + (r.cls ? " " + r.cls : ""));
    r.items.forEach(function (it) { list.appendChild(card(it)); });
    sec.appendChild(list);
    return sec;
  }
  function shortCard(it, idx) {
    var b = h("button", "card");
    var p;
    if (it.short.kind === "photo") {
      p = h("div", "poster");
      var img = new Image(); img.alt = ""; img.loading = "lazy";
      img.onload = function () { img.classList.add("ok"); };

    return b;
  }
  function renderHome(view, data) {
    view.replaceChildren(heroView(data.hero || []));
    var hist = PUB ? localHist : (data.history || []);
    if (hist.length) view.appendChild(rail({ title: "🕘 Davom ettiring", items: hist, cls: "hist" }));
    if (data.shorts && data.shorts.length) {
      var sec = h("section", "section");
      var mb = h("button", "more", ["Hammasi", icon("chev")]);
      mb.onclick = function () { show("shorts"); };
      sec.appendChild(h("div", "sec-head", [h("h2", null, "Shorts"), mb]));
      var list = h("div", "rail shorts-rail");
      data.shorts.forEach(function (it, i) { list.appendChild(shortCard(it, i)); });
      sec.appendChild(list);
      view.appendChild(sec);

    var any = false;
    if (data.choice && data.choice.length) { any = true; view.appendChild(rail({ title: "👑 Tomoshabinlar tanlovi", items: data.choice })); }
    (data.collections || []).forEach(function (c) {
      any = true;
      view.appendChild(rail({ title: c.title, items: c.items, more: function () { show("col", { id: c.id }); } }));
    });
    (data.rails || []).forEach(function (r) { if (r.items.length) { any = true; view.appendChild(rail(r)); } });

    view.appendChild(h("div", null, " "));

  function show(name, opts) {
    opts = opts || {};
    current = name;
    stopHero();
    leaveShorts();
    document.querySelectorAll(".nav button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.view === name);

    if (name === "shorts") return renderShorts(view, opts.start);
    if (name === "search") return renderSearch(view);
    if (name === "col") return renderCollection(view, opts.id, my);
    renderCategory(view, name, opts.sort || "new", my, opts.f || {});
  }

  // filtrlar: janr (chiplar) + davlat, yil, til (tanlash maydonlari)
  var FILTERS = [["country", "🌍 Davlat"], ["year", "📅 Yil"], ["lang", "🗣 Til"]];
  function renderCategory(view, cat, sort, my, f) {
    f = f || {};
    var any = !!(f.genre || f.country || f.year || f.lang);
    function go(changes) {
      haptic();
      renderCategory(view, cat, sort, ++reqId, Object.assign({}, f, changes));

    var page = h("div", "page");
    var count = h("span");

    var retry = h("button", "loadmore", "Qayta urinish");
    retry.onclick = function () { show(current); };
    view.replaceChildren(h("div", "page", [emptyBox("x", "Ulanishda xatolik", "Internetni tekshirib, qaytadan urinib ko'ring."), retry]));
  }

  // ───── batafsil oyna ─────
  var sheetOpen = false, sheetReq = 0;
  function openSheet(it) {
    haptic();
    var s = $("sheet");
    var bg = h("div", "bg" + (it.poster ? "" : " ph"));
    if (it.poster) bg.style.backgroundImage = "url('" + posterUrl(it) + "')";
    var closeBtn = h("button", "ibtn close", [icon("x")]);
    closeBtn.onclick = closeSheet;
    var chips = h("div", "chips", [h("span", "chip", NAMES[it.cat] || "Kino"), it.code > 0 ? h("span", "chip", "Kod: " + it.code) : null]);
    if (it.year) chips.appendChild(h("span", "chip", String(it.year)));
    if (it.parts > 1) chips.appendChild(h("span", "chip", it.parts + " qism"));
    (it.genres || []).forEach(function (g) { chips.appendChild(h("span", "chip g", g.label)); });
    if (it.country) chips.appendChild(h("span", "chip", it.country));
    if (it.lang) chips.appendChild(h("span", "chip", it.lang));
    if (it.quality) chips.appendChild(h("span", "chip", "🎞 " + it.quality));
    if (it.premium) chips.appendChild(h("span", "chip gold", "PREMIUM"));
    var similar = it.cat === "music" ? null : h("div", "similar");
    s.replaceChildren(
      h("div", "sheet-top", [bg, h("div", "grip"), closeBtn]),
      h("div", "sheet-main", [posterNode(it), h("div", "info", [h("h3", null, it.title), chips])]),
      it.desc ? h("p", "desc", it.desc) : null,
      actionRow(it, false),
      it.cat === "music" ? null : rateRow(it),
      h("div", "note", it.locked ? "Bu kontent Premium a'zolar uchun. Bot chatida Premium olish tugmasi chiqadi."
        : it.cat === "music" ? "«Tinglash» — shu yerning o'zida eshitasiz. Yonidagi tugma qo'shiqni Telegram botga yuboradi."
        : PUB ? "«Ko'rish» bosilsa, Telegram'da botimiz ochiladi va uni yuboradi."
        : "«" + (it.cat === "music" ? "Tinglash" : "Ko'rish") + "» bosilsa, bot uni chatga yuboradi."),
      similar
    );
    if (similar) {
      var myS = ++sheetReq;
      api("/api/similar?id=" + it.id).then(function (d) {
        if (myS !== sheetReq || !d.ok || !d.items.length) return;
        var list = h("div", "rail");
        d.items.forEach(function (x) { list.appendChild(card(x)); });
        similar.replaceChildren(h("div", "sec-head", [h("h2", null, "🎭 O'xshash kinolar")]), list);
      }).catch(function () {});
    }
    $("veil").classList.add("on");
    s.classList.add("on");
    s.scrollTop = 0;
    sheetOpen = true;
    stopHero();
    document.querySelectorAll(".short video").forEach(function (v) { v.pause(); });
    updateBack();
  }
  function closeSheet() {
    $("veil").classList.remove("on");
    $("sheet").classList.remove("on");
    sheetOpen = false;
    if (current === "home") restartHero();
    updateBack();
  }
  $("veil").onclick = closeSheet;

  function updateBack() {
    if (PUB || !tg || !tg.BackButton) return;
    if (sheetOpen || current !== "home") tg.BackButton.show(); else tg.BackButton.hide();
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(function () { if (sheetOpen) closeSheet(); else show("home"); });

  function watch(it, btn) {
    haptic("medium");
    rememberWatch(it);
    if (PUB) {
      if (!me.bot) { toast("⏳ Biroz kuting..."); return; }
      toast("📲 Telegram ochilmoqda...");
      openLink(botLink(it));
      return;
    }
    btn.disabled = true;
    var old = Array.prototype.slice.call(btn.childNodes);
    btn.replaceChildren("Yuborilmoqda...");
    api("/api/watch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: it.id }) })
      .then(function (res) {
        btn.disabled = false; btn.replaceChildren.apply(btn, old);
        var msg = {
          sub: "📢 Avval kanallarga obuna bo'ling — bot chatida tugmalar chiqdi.",
          premium: "💎 Bu Premium kontent — bot chatida Premium olish tugmasi bor.",
          blocked: "🤖 Avval botga /start bosing, so'ng qayta urinib ko'ring.",
          flood: "⏳ Juda tez! Biroz kuting.",
          not_found: "😔 Bu kontent o'chirilgan.",
          auth: "🔐 Saytni bot ichidan qayta oching."
        }[res.reason];
        if (res.ok) {
          notify("success");
          toast("✅ Botga yuborildi! Chatni oching.");
          setTimeout(function () { tg ? tg.close() : closeSheet(); }, 1100);
        } else if (res.reason === "sub" || res.reason === "premium") {
          notify("warning");
          toast(msg);
          setTimeout(function () { tg ? tg.close() : closeSheet(); }, 1800);
        } else {
          notify("error");
          toast(msg || "⚠️ Xatolik yuz berdi. Qaytadan urinib ko'ring.");
        }
      })
      .catch(function () { btn.disabled = false; btn.replaceChildren.apply(btn, old); toast("⚠️ Ulanishda xatolik."); });
  }

  // ───── sarlavha, navigatsiya ─────
  function onScroll() { $("top").classList.toggle("solid", current !== "home" || window.scrollY > 40); }
  window.addEventListener("scroll", onScroll, { passive: true });
  $("bSearch").appendChild(icon("search"));
  $("bSearch").onclick = function () { haptic(); show("search"); };
  $("bChannel").appendChild(icon("send"));
  $("bChannel").onclick = function () { haptic(); if (me.channel) openLink(me.channel); };
  var NAV = { home: ["home", "Asosiy"], movie: ["film", "Kinolar"], serial: ["tv", "Serial"], shorts: ["clap", "Shorts"],
              cartoon: ["smile", "Multfilm"], music: ["music", "Musiqa"], saved: ["bookmark", "Saqlangan"] };
  document.querySelectorAll(".nav button").forEach(function (b) {
    var n = NAV[b.dataset.view];
    b.replaceChildren(icon(n[0]), h("span", null, n[1]));
    b.onclick = function () { haptic(); show(b.dataset.view); };
  });

  function setBrand(name) {
    var parts = (name || "Marvarid Media").toUpperCase().split(" ");
    var last = parts.length > 1 ? parts.pop() : "";
    $("word").replaceChildren(h("span", "w1", parts.join(" ")), last ? h("span", "w2", last) : null);
    document.title = name;
  }
  function setAvatar(user) {
    var a = $("avatar");
    var name = (user && (user.first_name || "")) || "";
    var initials = (name.trim()[0] || "M") + ((user && user.last_name ? user.last_name[0] : "") || "");
    a.replaceChildren(initials.toUpperCase());
    if (user && user.photo_url) {
      var img = new Image();
      img.alt = "";
      img.onload = function () { a.replaceChildren(img); };
      img.src = user.photo_url;
    }
  }

  if (tg && !PUB) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
  if (PUB) $("avatar").classList.add("hidden");
  else setAvatar(tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null);
  // 📱 Android ilovadagi «orqaga» tugmasi: true — sayt o'zi hal qildi, false — ilovadan chiqish
  window.mmBack = function () {
    if (sheetOpen) { closeSheet(); return true; }
    if (current !== "home") { show("home"); return true; }
    return false;
  };
  api("/api/me").then(function (d) {
    if (!d.ok) return;
    me = d;
    setBrand(d.brand);
    if (d.channel) $("bChannel").classList.remove("hidden");
  });
//WELCOME
  (function () {
    var el = $("welcome");
    if (!el) return;
    var link = "";
    try { link = new URLSearchParams(location.search).get("k") || ""; } catch (e) {}
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (link || reduce) { el.remove(); return; }   // kanal postidagi havola — kino darhol ochilsin
    var user = !PUB && tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    var first = user && user.first_name ? String(user.first_name).trim().slice(0, 18) : "";
    var name = $("wName");
    var text = first ? first + "!" : "Kino olamiga!";
    Array.prototype.forEach.call(text, function (ch, i) {
      var s = document.createElement("span");
      s.textContent = ch;
      s.style.animationDelay = (2.3 + i * 0.045) + "s";
      name.appendChild(s);
    });
    if (!first) $("wSub").textContent = "Marvarid Media — eng sara kinolar bir joyda 🍿";
    var dust = $("wDust");
    for (var i = 0; i < 22; i++) {
      var d = document.createElement("i"), sz = 2 + Math.random() * 4;
      d.style.cssText = "left:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + sz + "px;animation-duration:" +
        (4 + Math.random() * 4) + "s;animation-delay:" + (Math.random() * 3.2) + "s;--dx:" + (Math.random() * 60 - 30) + "px";
      dust.appendChild(d);
    }
    if (!PUB) { try { tg.setHeaderColor("#050403"); tg.setBackgroundColor("#050403"); } catch (e) {} }
    var done = false;
    function finish() {
      if (done) return; done = true;
      el.classList.add("out");
      if (!PUB) { try { tg.setHeaderColor(theme === "dark" ? "#0b0a0d" : "#f8f5ef"); tg.setBackgroundColor(theme === "dark" ? "#0b0a0d" : "#f8f5ef"); } catch (e) {} }
      setTimeout(function () { el.remove(); }, 700);
    }
    setTimeout(function () { haptic("light"); }, 1900);
    setTimeout(function () { notify("success"); }, 2350);
    setTimeout(finish, 4300);
    el.addEventListener("click", finish);
  })();
  ///WELCOME
  show("home");
  // 🔗 kanal postidagi havola: ?k=15 (kino) yoki ?k=m3 (musiqa) — shu kino oynasi darhol ochiladi
  (function () {
    var k = "";
    try { k = new URLSearchParams(location.search).get("k") || ""; } catch (e) {}
    if (!k && tg && tg.initDataUnsafe && /^k/.test(tg.initDataUnsafe.start_param || "")) k = tg.initDataUnsafe.start_param.slice(1);
    if (!/^m?\d{1,9}$/.test(k)) return;
    api("/api/catalog?k=" + k).then(function (d) {
      if (d.ok && d.items && d.items.length) openSheet(d.items[0]);
      else toast("😔 Bu kino topilmadi yoki o'chirilgan");
    }).catch(function () {});
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  })();
})();
</script>
</body>
</html>
